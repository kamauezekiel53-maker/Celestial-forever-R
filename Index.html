<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Under Construction</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    header h1 {
      font-size: 3em;
      color: #ff4444;
      animation: blink 1s infinite;
      margin-bottom: 10px;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }

    main p {
      font-size: 1.2em;
      margin-bottom: 20px;
      color: #ddd;
    }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      margin: 0 auto;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 10px;
    }

    footer {
      margin-top: 20px;
      font-size: 0.9em;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    <h1>Under Construction</h1>
  </header>

  <main>
    <p>Happy Holidays 🎄 — enjoy the music while it's under construction!</p>
    <section class="video-container">
      <iframe 
        src="https://www.youtube.com/embed/kt3jIW6iPnw?autoplay=1&mute=1&rel=0&modestbranding=1"
        title="YouTube video player"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </section>
  </main>

  <footer>
    <p>If autoplay doesn’t start, press play or <a href="https://youtu.be/kt3jIW6iPnw" target="_blank" rel="noopener">open on YouTube</a>.</p>
  </footer>
</body>
  </html>
